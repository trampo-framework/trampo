name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: every suite
        working-directory: core/scripts
        run: GIT_CONFIG_GLOBAL=/dev/null python3 -B -m unittest discover -p 'test_*.py'
      - name: a workspace built from the seeds is healthy
        run: |
          cp -R core/seeds/. "$RUNNER_TEMP/ws"
          cp -R modules/mode-adhoc/seeds/. modules/mode-card/seeds/. modules/mode-triage/seeds/. "$RUNNER_TEMP/ws"
          git -C "$RUNNER_TEMP/ws" init -q -b main
          python3 -B core/scripts/doctor.py "$RUNNER_TEMP/ws"
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 detect --source /repo --redact --verbose
      - name: deny-scan
        env: { DENY_TERMS: '${{ secrets.DENY_TERMS }}' }
        run: scripts/deny-scan.sh
